name: CI
on:
  pull_request:
    branches: [main]
# A new push to a PR cancels its older in-progress run so a stuck runner can't
# linger (CI only runs on pull_request, so this never affects main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run format:check # Prettier — fails if anything is unformatted
      - run: npm run lint # fails on errors; warnings are allowed
      - run: npm run typecheck # explicit type-check (not just implied by build)
      - run: npm run test:coverage # unit tests + enforced coverage thresholds
      # Default test zone is America/Los_Angeles (west of UTC); re-run east of
      # UTC so day-key bugs can't hide on either side of the date line.
      - run: npm test
        env: { TZ: Pacific/Auckland }
      - run: npm run build
      - name: Audit dependencies (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true # surface advisories without blocking the PR
  # Edge functions run on Deno and aren't covered by tsc; type-check them here.
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check supabase/functions/*/index.ts
