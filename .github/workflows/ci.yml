name: CI
on:
  pull_request:
    branches: [main]
# A new push to a PR cancels its older in-progress run so a stuck runner can't
# linger (CI only runs on pull_request, so this never affects main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run format:check # Prettier — fails if anything is unformatted
      - run: npm run lint # fails on errors; warnings are allowed
      - run: npm run typecheck # explicit type-check (not just implied by build)
      - run: npm run test:coverage # unit tests + enforced coverage thresholds
      - run: npm run build
      - name: Audit dependencies (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true # surface advisories without blocking the PR
