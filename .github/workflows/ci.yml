name: CI
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint           # fails on errors; warnings are allowed
      - run: npm run typecheck      # explicit type-check (not just implied by build)
      - run: npm run test:coverage  # unit tests + enforced coverage thresholds
      - run: npm run build
      - name: Audit dependencies (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true     # surface advisories without blocking the PR
