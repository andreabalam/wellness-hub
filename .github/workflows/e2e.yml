name: E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main] # catch E2E regressions before merge, not only after
# Auto-cancel a PR's older in-progress runs when it's pushed again, so a stuck
# runner can't linger. Never cancel main/deploy runs (a publish must finish).
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  e2e:
    runs-on: ubuntu-latest
    # E2E normally finishes in 2–10 min; cap well above that so a hung runner
    # fails fast instead of burning the default 6-hour budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: e2e # only runs if e2e job succeeds
    # Deploy only on push to main — never on pull_request runs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # needed to push to the gh-pages branch
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "github-actions[bot]@users.noreply.github.com"
      # Embed the GITHUB_TOKEN in the remote URL so gh-pages can authenticate
      # over HTTPS without a stored credential helper.
      - run: git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      - run: npm run deploy
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OURA_CLIENT_ID: ${{ secrets.VITE_OURA_CLIENT_ID }}
